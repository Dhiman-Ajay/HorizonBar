<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HorizonBar</title>
    <link rel="stylesheet" href="bar.css">
</head>

<body>
    <div id="tab-container">
        <!-- Tabs injected here -->
    </div>
    <div id="control-strip">
        <button id="btn-new-tab" title="New Tab">+</button>
        <button id="btn-compact" title="Compact Mode">⊞</button>
        <button id="btn-donate" title="Donate">❤️</button>
        <button id="btn-close" title="Close Bar">×</button>
    </div>
    <script src="bar.js"></script>
</body>

</html>
